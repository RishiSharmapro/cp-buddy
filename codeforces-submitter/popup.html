<!DOCTYPE html>
<html>
<head>
    <title>Submit Codeforces Solution</title>
    <style>
        body { width: 300px; padding: 10px; font-family: Arial, sans-serif; }
        textarea { width: 100%; height: 100px; }
    </style>
</head>
<body>
    <h3>Submit Solution</h3>
    <label for="problemUrl">Problem URL:</label>
    <input type="text" id="problemUrl" placeholder="Enter Problem URL" />
    <br /><br />
    <label for="sourceCode">Source Code:</label>
    <textarea id="sourceCode"></textarea>
    <br /><br />
    <button id="submitBtn">Submit Solution</button>
    
    <script src="popup.js"></script>
</body>
</html>
